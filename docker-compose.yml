services:
  mysql:
    image: mysql:8.4
    container_name: validator-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: validator_ia
      MYSQL_USER: validator
      MYSQL_PASSWORD: validator123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: