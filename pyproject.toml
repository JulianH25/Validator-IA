[project]
name = "visor-video"
version = "0.1.0"
description = "Visor de video"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "mysql-connector-python>=26.10.0",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
]

[project.scripts]
start = "visor_video.visor_video:start"


[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
